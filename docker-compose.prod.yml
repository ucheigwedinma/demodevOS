# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    restart: always
    secrets:
      - db_password

  server:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile -
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    env_file:
      - ./server/.env.prod
    secrets:
      - django_secret_key
      - db_password
      - email_host_password
      - oauth_google_client_id
      - oauth_google_client_secret
      - oauth_microsoft_client_id
      - oauth_microsoft_client_secret

  celery:
    volumes:
      - media:/app/media
    env_file:
      - ./server/.env.prod
    secrets:
      - django_secret_key
      - db_password
      - email_host_password

  celery-beat:
    volumes: []
    env_file:
      - ./server/.env.prod
    secrets:
      - django_secret_key
      - db_password

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./client/build:/usr/share/nginx/html:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  certbot-webroot:

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
  db_password:
    file: ./secrets/db_password
  email_host_password:
    file: ./secrets/email_host_password
  oauth_google_client_id:
    file: ./secrets/oauth_google_client_id
  oauth_google_client_secret:
    file: ./secrets/oauth_google_client_secret
  oauth_microsoft_client_id:
    file: ./secrets/oauth_microsoft_client_id
  oauth_microsoft_client_secret:
    file: ./secrets/oauth_microsoft_client_secret
