<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{% block title %}developerOS{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

    /* Base */
    body {
      font-family: 'Raleway', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: #171717;
    }

    /* Links */
    a { color: #171717; }

    /* Responsive */
    @media only screen and (max-width: 600px) {
      .email-container { width: 100% !important; }
      .fluid { max-width: 100% !important; height: auto !important; }
      .stack-column { display: block !important; width: 100% !important; }
      .padding-mobile { padding-left: 24px !important; padding-right: 24px !important; }
      .header-padding { padding: 28px 24px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: 'Raleway', 'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <!-- Preheader (hidden text for email clients) -->
  <div style="display: none; font-size: 1px; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all;">
    {% block preheader %}{% endblock %}
  </div>

  <!-- Outer wrapper -->
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f5f5f5;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Email container -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="560" class="email-container" style="max-width: 560px; width: 100%; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">

          <!-- Header — black block with white logo -->
          <tr>
            <td align="center" class="header-padding" style="background-color: #0a0a0a; padding: 36px 48px;">
              <img src="{{ logo_url }}" alt="developerOS" width="160" style="display: block; width: 160px; max-width: 160px; height: auto;" />
            </td>
          </tr>

          <!-- Body — white block -->
          <tr>
            <td style="background-color: #ffffff;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td class="padding-mobile" style="padding: 44px 48px; font-family: 'Raleway', 'Helvetica Neue', Helvetica, Arial, sans-serif;">
                    {% block body %}{% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /Email container -->

        <!-- Footer — outside the card -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="560" class="email-container" style="max-width: 560px; width: 100%;">
          <tr>
            <td align="center" style="padding: 28px 16px 0 16px;">
              <p style="margin: 0 0 6px 0; font-size: 13px; font-family: 'Raleway', 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1;">
                <span style="font-weight: 400; color: #171717;">developer</span><span style="font-weight: 700; color: #a3a3a3;">OS</span>
              </p>
              <p style="margin: 0 0 10px 0; font-size: 12px; line-height: 20px; color: #a3a3a3; font-family: 'Raleway', 'Helvetica Neue', Helvetica, Arial, sans-serif;">
                &copy; {{ year }} All rights reserved.
              </p>
              <p style="margin: 0; font-size: 12px; line-height: 20px; color: #a3a3a3; font-family: 'Raleway', 'Helvetica Neue', Helvetica, Arial, sans-serif;">
                <a href="{{ frontend_url }}/help" style="color: #a3a3a3; text-decoration: underline;">Help</a>
                &nbsp;&middot;&nbsp;
                <a href="{{ frontend_url }}/privacy" style="color: #a3a3a3; text-decoration: underline;">Privacy</a>
                &nbsp;&middot;&nbsp;
                <a href="{{ frontend_url }}/terms" style="color: #a3a3a3; text-decoration: underline;">Terms</a>
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
