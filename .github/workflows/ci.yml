name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint, security scan, dependency audit, tests
  # ---------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_developerOS
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install ruff bandit safety

      # --- Lint ---
      - name: Ruff lint
        run: ruff check server/ --output-format=github

      - name: Ruff format check
        run: ruff format server/ --check

      # --- Security scan ---
      - name: Bandit security scan
        run: bandit -r server/apps/ server/config/ -c pyproject.toml --format github || true

      # --- Dependency audit ---
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r server/requirements.txt || true

      # --- Django checks ---
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_NAME: test_developerOS
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: python server/manage.py check --deploy 2>&1 | head -50

      # --- Tests ---
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_NAME: test_developerOS
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        working-directory: server
        run: python manage.py test apps/ --verbosity=2 --parallel

  # ---------------------------------------------------------------------------
  # Frontend: type check, build
  # ---------------------------------------------------------------------------
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Type check (svelte-check)
        run: npm run check
        working-directory: client
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: client

  # ---------------------------------------------------------------------------
  # Console: type check, build
  # ---------------------------------------------------------------------------
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: console

      - name: Type check (svelte-check)
        run: npm run check
        working-directory: console
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: console
