# ============================================================
# developerOS Production — Nginx Configuration
# Domains: app.developeros.pro, api.developeros.pro, console.developeros.pro
# ============================================================

# --- API Backend (HTTP + WebSocket) ---
server {
    listen 80;
    server_name api.developeros.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.developeros.pro;

    ssl_certificate /etc/letsencrypt/live/api.developeros.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.developeros.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # WebSocket — must come before the catch-all
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Django static files (admin, DRF browsable API)
    location /static/ {
        alias /opt/developerOS/server/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded media
    location /media/ {
        alias /opt/developerOS/server/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API + Admin
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Frontend App ---
server {
    listen 80;
    server_name app.developeros.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.developeros.pro;

    ssl_certificate /etc/letsencrypt/live/app.developeros.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.developeros.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/developeros/client;
    index index.html;

    # SPA routing
    location / {
        try_files $uri /index.html;
    }

    # API proxy — so the SPA's relative /api calls reach the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host api.developeros.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.developeros.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Media proxy
    location /media/ {
        alias /opt/developerOS/server/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static asset caching
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|webp|avif|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# --- Console (Admin Dashboard) ---
