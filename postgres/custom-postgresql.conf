# ---------------------------------------------------------------------------
# developerOS — Custom PostgreSQL configuration for WAL archiving
#
# This file is mounted into the PostgreSQL container and extends the
# default configuration. Only override settings that differ from defaults.
# ---------------------------------------------------------------------------

# --- WAL Archiving -----------------------------------------------------------
# Enables continuous WAL archiving for point-in-time recovery (PITR).
# Segments are copied to /wal_archive/ (shared Docker volume) and uploaded
# to Backblaze B2 by the Celery hourly task.

wal_level = replica
archive_mode = on
archive_command = 'cp %p /wal_archive/%f'
archive_timeout = 3600

# --- Connection & Memory (tuned for Hostinger VPS) --------------------------
listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# --- Logging -----------------------------------------------------------------
log_timezone = 'UTC'
timezone = 'UTC'
